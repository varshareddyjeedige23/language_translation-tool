<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Language Translation Tool</title>

    <!-- CSS file -->
    <link rel="stylesheet" href="style.css">

    <!-- Mobile responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<div class="container">

    <h1>🌍 Language Translation Tool</h1>

    <!-- Input Text -->
    <label for="inputText">Enter Text</label>
    <textarea id="inputText" rows="4" placeholder="Type text here..."></textarea>

    <!-- Source Language -->
    <label for="sourceLang">Source Language</label>
    <select id="sourceLang">
        <option value="en">English</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>
        <option value="mr">Marathi</option>
        <option value="bn">Bengali</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="ar">Arabic</option>
    </select>

    <!-- Target Language -->
    <label for="targetLang">Target Language</label>
    <select id="targetLang">
        <option value="te">Telugu</option>
        <option value="hi">Hindi</option>
        <option value="en">English</option>
        <option value="ta">Tamil</option>
        <option value="kn">Kannada</option>
        <option value="ml">Malayalam</option>
        <option value="mr">Marathi</option>
        <option value="bn">Bengali</option>
        <option value="fr">French</option>
        <option value="es">Spanish</option>
        <option value="de">German</option>
        <option value="ar">Arabic</option>
    </select>

    <!-- Translate Button -->
    <button onclick="translateText()">Translate</button>

    <!-- Output Text -->
    <div class="output">
        <label for="outputText">Translated Text</label>
        <textarea id="outputText" rows="4" readonly></textarea>
    </div>

</div>

<!-- JavaScript file -->
<script src="script.js"></script>

</body>
</html>
